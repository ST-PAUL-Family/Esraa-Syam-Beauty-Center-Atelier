<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esraa Syam | Beauty Center & Atelier</title>
<meta name="description" content="Esraa Syam Beauty Center & Atelier - Follow us and get in touch.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&family=Great+Vibes&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  /* ===== DAY LIGHTING ===== */
  --sage:#9fb1ac;
  --sage-dark:#7d918d;
  --stripe:rgba(40,60,60,.30);
  --vein:#f1c9b0;
  --card:#f7eee4;
  --card-2:#efe2d3;
  --ink:#1d3438;
  --ink-soft:#4b6266;
  --copper:#c98d57;
  --copper-2:#f0c493;
  --glow:rgba(255,214,170,.85);
  --frame:#fbeedd;
  --btn-bg:rgba(255,255,255,.55);
  --btn-border:rgba(201,141,87,.55);
  --shadow:0 20px 50px rgba(60,40,20,.25);
  --lamp-cone:rgba(255,236,200,.55);
  --text-glow:none;
  --gold: linear-gradient(135deg,#8a5a24 0%,#d9a35c 30%,#fff1c9 50%,#c98d57 70%,#7a4d1d 100%);
}
body.night{
  /* ===== NIGHT LIGHTING (glowing sign look) ===== */
  --sage:#2c3a40;
  --sage-dark:#1a2428;
  --stripe:rgba(0,0,0,.55);
  --vein:#f0a766;
  --card:#1b2326;
  --card-2:#222d31;
  --ink:#fff3e3;
  --ink-soft:#e8cfb2;
  --copper:#ffb26b;
  --copper-2:#ffd9a8;
  --glow:rgba(255,160,70,.95);
  --frame:#ffe2c0;
  --btn-bg:rgba(255,255,255,.05);
  --btn-border:rgba(255,178,107,.6);
  --shadow:0 0 60px rgba(255,150,60,.35);
  --lamp-cone:rgba(255,190,110,.35);
  --text-glow:0 0 8px rgba(255,150,60,.9),0 0 22px rgba(255,130,40,.55);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  font-family:'Montserrat',sans-serif;
  color:var(--ink);
  display:flex;justify-content:center;align-items:flex-start;
  padding:22px 14px 40px;
  background:
    repeating-linear-gradient(90deg,var(--stripe) 0 3px,transparent 3px 26px),
    linear-gradient(180deg,var(--sage) 0%,var(--sage-dark) 100%);
  transition:background .6s ease,color .4s ease;
  overflow-x:hidden;
}
body[dir="rtl"], body.ar{font-family:'Cairo','Montserrat',sans-serif}

/* marble veins layer */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600' fill='none' stroke='%23f1c9b0' stroke-width='1.6' stroke-linecap='round'><path d='M40 0 C90 90 40 160 120 230 S190 330 150 420 S230 520 210 600'/><path d='M120 230 C180 220 210 250 260 240'/><path d='M150 420 C100 450 90 500 40 520'/><path d='M420 0 C380 80 470 140 440 230 S500 330 540 400 S520 520 600 560'/><path d='M440 230 C500 250 520 220 590 240'/><path d='M330 320 C370 340 380 390 350 430'/></svg>");
  background-size:600px 600px;
}
body.night::before{opacity:.35;filter:drop-shadow(0 0 3px rgba(255,150,60,.8))}

/* glowing frame */
.frame{
  position:relative;z-index:1;
  width:100%;max-width:460px;
  padding:14px;
  border-radius:6px;
  background:linear-gradient(145deg,#fff6ea,#f6d7b5);
  box-shadow:0 0 0 2px var(--frame),0 0 30px 6px var(--glow),var(--shadow);
  transition:box-shadow .6s ease,background .6s ease;
}
body.night .frame{background:linear-gradient(145deg,#ffd9b0,#e08a3a);box-shadow:0 0 0 2px #ffe8cf,0 0 45px 12px var(--glow),var(--shadow)}

.panel{
  position:relative;overflow:hidden;
  border-radius:4px;
  padding:0 0 28px;
  background:
    repeating-linear-gradient(90deg,var(--stripe) 0 3px,transparent 3px 26px),
    linear-gradient(180deg,var(--sage) 0%,var(--sage-dark) 100%);
  box-shadow:inset 0 0 40px rgba(255,230,200,.45);
  transition:background .6s ease;
}
body.night .panel{box-shadow:inset 0 0 50px rgba(255,150,60,.35)}

/* top controls */
.toolbar{
  position:absolute;top:12px;inset-inline:12px;z-index:5;
  display:flex;justify-content:space-between;align-items:center;
}
.tbtn{
  font:600 12px 'Montserrat',sans-serif;letter-spacing:.12em;
  color:var(--ink);
  background:var(--btn-bg);
  border:1px solid var(--btn-border);
  border-radius:999px;padding:8px 14px;cursor:pointer;
  backdrop-filter:blur(6px);
  display:inline-flex;align-items:center;gap:7px;
  transition:.25s;
}
body.ar .tbtn{font-family:'Cairo',sans-serif;letter-spacing:0}
.tbtn:hover{transform:translateY(-2px);box-shadow:0 0 14px var(--glow)}
.tbtn svg{width:15px;height:15px}

/* lamp */
.lamp{position:relative;height:120px;display:flex;justify-content:center;z-index:3}
.lamp button{
  position:relative;background:none;border:0;cursor:pointer;width:60px;
  display:flex;flex-direction:column;align-items:center;
}
.cord{width:2px;height:40px;background:linear-gradient(var(--copper),var(--copper-2))}
.shade{
  width:44px;height:30px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(90deg,#8a5a24,#e9b97c 40%,#fff0cf 55%,#b97b3d);
  box-shadow:0 0 18px var(--glow);
}
.bulb{width:30px;height:7px;border-radius:0 0 20px 20px;background:#fff6d8;box-shadow:0 0 18px 6px var(--glow)}
.cone{
  position:absolute;top:104px;left:50%;transform:translateX(-50%);
  width:260px;height:220px;pointer-events:none;
  background:radial-gradient(ellipse at top,var(--lamp-cone),transparent 70%);
  clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
  transition:opacity .6s;
}
body.night .cone{opacity:1}

/* main card */
.card{
  position:relative;z-index:2;
  margin:-6px 18px 0 18px;
  padding:44px 22px 24px;
  border-radius:4px 4px 4px 4px;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.55),transparent 55%),
    linear-gradient(180deg,var(--card),var(--card-2));
  border:2px solid var(--copper);
  border-top-left-radius:90px 40px;
  border-top-right-radius:6px;
  box-shadow:var(--shadow),inset 0 0 0 4px rgba(255,255,255,.18);
  transition:background .6s,border-color .6s;
  animation:rise .9s ease both;
  text-align:center;
}
.card::before{ /* copper curve accent */
  content:"";position:absolute;inset:6px;border:1px solid var(--copper);opacity:.45;
  border-top-left-radius:84px 36px;pointer-events:none;
}
.leaf{position:absolute;opacity:.16;width:150px;pointer-events:none}
body.night .leaf{opacity:.28;filter:drop-shadow(0 0 6px rgba(255,150,60,.6))}
.leaf.r{right:-14px;top:70px}
.leaf.l{left:-22px;bottom:110px;transform:scaleX(-1) rotate(-15deg);width:120px}

/* monogram */
.monogram{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:170px;height:150px;margin-bottom:2px;
  font-family:'Playfair Display',serif;
}
.monogram img{max-width:100%;max-height:100%;object-fit:contain;
  filter:drop-shadow(0 6px 10px rgba(90,50,10,.35));transition:filter .6s,transform .4s;animation:rise .9s ease both}
.monogram img:hover{transform:scale(1.05) rotate(-1.5deg)}
body.night .monogram img{filter:drop-shadow(0 0 10px rgba(255,170,80,.95)) drop-shadow(0 0 26px rgba(255,140,50,.7)) brightness(1.08)}
.monogram .e,.monogram .s{
  background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 2px rgba(80,40,0,.35));
  background-size:200% 200%;animation:sheen 5s linear infinite;
}
body.night .monogram .e,body.night .monogram .s{filter:drop-shadow(0 0 10px rgba(255,150,60,.9))}
.monogram .e{font-size:92px;font-weight:500;line-height:1;transform:translateX(8px)}
.monogram .s{font-size:80px;font-style:italic;font-weight:500;line-height:1;transform:translate(-18px,16px)}

h1{
  font-family:'Playfair Display',serif;font-weight:600;
  font-size:clamp(34px,9vw,44px);line-height:1.05;letter-spacing:.01em;
  color:var(--ink);text-shadow:var(--text-glow);
}
body.ar h1{font-family:'Cairo',sans-serif;font-weight:700}
.sub{
  margin-top:8px;font-size:13px;letter-spacing:.34em;font-weight:500;color:var(--ink);text-shadow:var(--text-glow);
}
body.ar .sub{letter-spacing:.08em;font-size:14px}
.amp{display:block;color:var(--copper);margin-top:2px;font-size:15px}
.atelier{
  font-family:'Great Vibes',cursive;font-size:44px;line-height:1.1;color:var(--ink);text-shadow:var(--text-glow);
  display:flex;align-items:center;justify-content:center;gap:12px;
}
body.ar .atelier{font-family:'Cairo',sans-serif;font-size:32px;font-weight:600}
.atelier::before,.atelier::after{content:"";height:2px;width:38px;background:var(--copper);box-shadow:0 0 8px var(--glow)}

.divider{margin:18px auto 14px;width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--copper),transparent)}
.hello{font-size:13px;color:var(--ink-soft);margin-bottom:16px;letter-spacing:.04em}
body.ar .hello{font-size:14px}

/* links */
.links{display:grid;gap:13px}
.link{
  position:relative;display:flex;align-items:center;gap:16px;
  padding:12px 16px;border-radius:16px;text-decoration:none;color:var(--ink);
  background:var(--btn-bg);border:1px solid var(--btn-border);
  backdrop-filter:blur(4px);
  text-align:start;
  transition:transform .25s,box-shadow .25s,border-color .25s;
  opacity:0;animation:rise .7s ease forwards;
}
.link:nth-child(1){animation-delay:.15s}.link:nth-child(2){animation-delay:.25s}
.link:nth-child(3){animation-delay:.35s}.link:nth-child(4){animation-delay:.45s}
.link:nth-child(5){animation-delay:.55s}
.link:hover,.link:focus-visible{
  transform:translateY(-4px) scale(1.015);outline:none;
  border-color:var(--copper);
  box-shadow:0 10px 26px rgba(120,70,20,.25),0 0 22px var(--glow);
}
.link .ico{
  flex:0 0 66px;width:66px;height:66px;border-radius:18px;overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,.25);
  transition:transform .3s;
}
.link:hover .ico{transform:rotate(-6deg) scale(1.08)}
.link .ico svg,.link .ico img{width:100%;height:100%;display:block;object-fit:cover}
.link .txt{flex:1;min-width:0}
.link .name{font-weight:600;font-size:17px;letter-spacing:.03em}
body.ar .link .name{font-size:18px}
.link .desc{font-size:12px;color:var(--ink-soft);margin-top:3px}
body.ar .link .desc{font-size:13px}
.link .arrow{width:22px;height:22px;color:var(--copper);transition:transform .25s}
.link:hover .arrow{transform:translateX(5px)}
[dir="rtl"] .link .arrow{transform:scaleX(-1)}
[dir="rtl"] .link:hover .arrow{transform:scaleX(-1) translateX(5px)}

.tagline{
  margin-top:24px;font-family:'Great Vibes',cursive;font-size:30px;line-height:1.15;color:var(--ink);text-shadow:var(--text-glow);
}
body.ar .tagline{font-family:'Cairo',sans-serif;font-size:20px;font-weight:600}
.heart{display:block;margin:8px auto 0;width:22px;color:#1f4a52}
body.night .heart{color:#ff9f55;filter:drop-shadow(0 0 8px rgba(255,140,50,.9))}

.foot{margin-top:18px;font-size:11px;letter-spacing:.2em;color:var(--ink-soft)}
body.ar .foot{letter-spacing:.05em}

@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes sheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>

/* ----- Translations ----- */
const I18N = {
  en: {
    name:"Esraa Syam", beauty:"BEAUTY CENTER", atelier:"Atelier",
    hello:"Follow us & get in touch — tap any icon",
    tagline:"Your beauty,<br>our priority",
    lang:"العربية", light:["Night glow","Day light"],
    facebook:["Facebook","Follow our page"], tiktok:["TikTok","Watch our videos"],
    whatsapp:["WhatsApp Group","Join our community"], vodafone:["Vodafone Cash","Send payment easily"],
    instapay:["InstaPay","Instant payment"]
  },
  ar: {
    name:"إسراء سيام", beauty:"مركز تجميل", atelier:"أتيليه",
    hello:"تابعنا وتواصل معنا — اضغط على أي أيقونة",
    tagline:"جمالك،<br>أولويتنا",
    lang:"English", light:["إضاءة ليلية","إضاءة نهارية"],
    facebook:["فيسبوك","تابع صفحتنا"], tiktok:["تيك توك","شاهد فيديوهاتنا"],
    whatsapp:["جروب واتساب","انضم لمجتمعنا"], vodafone:["فودافون كاش","ادفع بسهولة"],
    instapay:["إنستا باي","دفع فوري"]
  }
};

const arrowSVG = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ----- Build link cards ----- */
const linksBox = document.getElementById('links');
LINKS.forEach(l=>{
  const a = document.createElement('a');
  a.className = 'link';
  a.href = l.href;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.dataset.key = l.key;
  const icon = l.icon ? `<img src="${l.icon}" alt="${l.key}">` : ICONS[l.key];
  a.innerHTML = `<span class="ico">${icon}</span>
    <span class="txt"><div class="name"></div><div class="desc"></div></span>${arrowSVG}`;
  linksBox.appendChild(a);
});

/* ----- Optional custom logo ----- */
if (LOGO_SRC){
  document.getElementById('logoBox').innerHTML = `<img src="${LOGO_SRC}" alt="Esraa Syam logo" onerror="this.parentNode.innerHTML='<span class=e>E</span><span class=s>S</span>'">`;
}

/* ----- State: language + lighting (remembered) ----- */
const body = document.body;
let lang = 'en', night = false;
try{ lang = localStorage.getItem('es_lang') || 'en'; night = localStorage.getItem('es_night') === '1'; }catch(e){}

function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  body.dir = lang === 'ar' ? 'rtl' : 'ltr';
  body.classList.toggle('ar', lang === 'ar');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML = t[el.dataset.i18n]; });
  document.querySelectorAll('.link').forEach(a=>{
    const [n,d] = t[a.dataset.key];
    a.querySelector('.name').textContent = n;
    a.querySelector('.desc').textContent = d;
  });
  document.getElementById('langLabel').textContent = t.lang;
  document.getElementById('lightLabel').textContent = t.light[night ? 1 : 0];
  document.title = (lang==='ar' ? 'إسراء سيام | مركز تجميل وأتيليه' : 'Esraa Syam | Beauty Center & Atelier');
  try{ localStorage.setItem('es_lang', lang); }catch(e){}
}
function applyLight(){
  body.classList.toggle('night', night);
  document.getElementById('lightLabel').textContent = I18N[lang].light[night ? 1 : 0];
  try{ localStorage.setItem('es_night', night ? '1' : '0'); }catch(e){}
}
document.getElementById('langBtn').onclick = ()=>{ lang = lang==='en' ? 'ar' : 'en'; applyLang(); };
const toggleLight = ()=>{ night = !night; applyLight(); };
document.getElementById('lightBtn').onclick = toggleLight;
document.getElementById('lampBtn').onclick = toggleLight;

document.getElementById('yr').textContent = new Date().getFullYear();
applyLang(); applyLight();
</script>
</body>
